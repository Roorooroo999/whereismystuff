profiles:
  - basic-docker-build

owner:
  group: gcp-merch-execution-intel-writer

app:
  name: wheres-my-stuff

build:
  docker:
    app:
      contextDir: "."
      dockerFile: "Dockerfile"

deploy:
  namespace: merch-execution

  helm:
    values:
      min:
        cpu: "500m"
        memory: "2Gi"
      max:
        cpu: "2000m"
        memory: "8Gi"      # 5 BQ tables cached as DataFrames concurrently — bumped from 6Gi for headroom

      networking:
        externalPort: 8080
        internalPort: 8080
        httpsEnabled: true
        httpEnabled: true

      livenessProbe:
        enabled: "true"
        path: "/api/health"
        wait: 120           # FastAPI starts in seconds; 120s buffer for Akeyless init
        probeInterval: 30
        timeout: 10
        failureThreshold: 6

      readinessProbe:
        enabled: "true"
        path: "/api/health"
        wait: 120           # /api/health returns 200 immediately (BQ loads are background)
        probeInterval: 20
        timeout: 10
        failureThreshold: 8

      env:
        PORT: "8080"
        WMS_CACHE_DIR: "/tmp/wms_cache"
        GOOGLE_APPLICATION_CREDENTIALS: "/etc/secrets/gcp-sa-key.json"
        PROJECT_ID: "wmt-execution-intel-prod"
        HIST_PROJECT_ID: "wmt-execution-intel-prod"
        DATASET: "WM_AD_HOC"
        TABLE: "WHERES_MY_STUFF_ROLLUP"
        HIST_TABLE: "R0C0JUG_WMUS_HIST_COMBINED"
        DC_HIST_TABLE: "R0C0JUG_WMUS_HIST_DC_LEVEL"
        ONORDER_TABLE: "R0C0JUG_WMUS_HIST_ONORDER"
        STO_TABLE: "R0C0JUG_WMUS_HIST_STO"
        PYTHONUNBUFFERED: "1"
        # GCS parquet cache — pod restarts download from GCS (~5-8s) instead of re-querying BQ (~35-40s)
        # Bucket must exist in wmt-execution-intel-prod and SA must have storage.objectAdmin on it
        WMS_CACHE_BUCKET: "wmt-execution-intel-prod-wms-cache"

      secrets:
        engine: eso
        akeyless: true
        config:
          akeyless:
            path: "/Prod/WCNP/homeoffice/gcp-merch-execution-intel-writer"
        files:
          - destination: "gcp-sa-key.json"
            content: "enablement-cale-gcp-sa"

  stages:
    - name: dev
      target:
        cluster_id:
          - "uscentral-dev-gke-002"

    - name: stage
      target:
        cluster_id:
          - "uscentral-stage-gke-002"

    # Uncomment for prod after stage validation + CRQ approval
    # - name: prod
    #   target:
    #     cluster_id:
    #       - "uscentral-prod-gke-001"
    #   changeRecord:
    #     type: auto
    #     group: "Merchandising Execution"
    #     managerGroup: "Change Managers - US"
    #     affectedGEOs: ["US"]
    #     businessUnits: ["Home Office"]
    #     primaryCI: "wheres-my-stuff"
    #     risk: "3"
    #     impact: "3"

notify:
  slack:
    channelName: "merch-execution-cicd"
